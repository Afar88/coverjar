name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/vercel-neon-private-blob]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Synchronize dependency lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Full dependency audit (must be clean)
        run: npm audit --audit-level=low
      - name: Automated PostgreSQL adapter tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          GEMINI_API_KEY: ""
          PAYPAL_CLIENT_ID: ""
          PAYPAL_CLIENT_SECRET: ""
          PAYPAL_ENVIRONMENT: SANDBOX
